name: Docker Build & Scan

on:
  push:
    tags:
      - '*'        # Release tags
    branches:
      - develop    # Feature branches
  pull_request:
    branches:
      - develop

permissions:
  packages: write

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lower case repository name
        run: echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set proper tag name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TAG_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push full Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}

      - name: Build & push runtime stage (for Trivy scan)
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}-runtime

  secure_scan:
    runs-on: ubuntu-latest
    needs: build_docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    steps:
      - name: Trivy Scan (runtime image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}-runtime
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Optional: scan source code for secrets or vulnerabilities
      # - name: Trivy Scan source code
      #   uses: aquasecurity/trivy-action@v0.33.1
      #   with:
      #     scan-type: fs
      #     path: ./app
      #     format: table
      #     exit-code: 1
      #     vuln-type: code,secret
      #     severity: CRITICAL,HIGH

   
      # 2b. Scan source code
