name: Feature Branch - Docker Build

on:
  pull_request:
    branches:
      - 'develop'
  push:
    tags:
      - '*'

permissions:
  packages: write

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case Github repository name
        run: echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set proper tag name for Docker image
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_NAME_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          echo "TAG_NAME=$BRANCH_NAME_LOWER" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref_name }}

      - name: Build Docker image (full build)
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}

      - name: Build Docker image (runtime stage only for Trivy)
        run: |
          docker build --target runtime -t ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}-runtime .

  secure_scan:
    runs-on: ubuntu-latest
    needs: build_docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    steps:
      - name: Trivy Scan (runtime image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}-runtime
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
   
      # 2b. Scan source code
